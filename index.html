<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Prices Comparison</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <h1 class="mb-1">Flight Prices Comparison</h1>
    <p class="text-muted mb-4">Explore multi-leg flight combination costs between destinations.</p>

    <div class="row mb-3 g-2 align-items-end">
      <div class="col-auto">
        <label for="originSelect" class="form-label fw-semibold mb-1">Origin</label>
        <select id="originSelect" class="form-select form-select-sm"></select>
      </div>
      <div class="col-auto">
        <label for="maxPrice" class="form-label fw-semibold mb-1">Max price (USD)</label>
        <input id="maxPrice" type="number" class="form-control form-control-sm" placeholder="e.g. 1200" style="width:130px" />
      </div>
      <div class="col-auto">
        <button id="resetBtn" class="btn btn-outline-secondary btn-sm">Reset</button>
      </div>
    </div>

    <div id="vis"></div>
  </div>

  <div id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
